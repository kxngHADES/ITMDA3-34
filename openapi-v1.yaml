    patch:
      tags: [Admin]
      operationId: updateServicePoint
      summary: Edit a service point or deactivate it (`is_active = false`)
      description: Deactivating fails with `400 QUEUE_NOT_EMPTY` while its queue still has waiting or called tickets.
      x-roles: [it_admin, manager]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateServicePointRequest' }
      responses:
        '200':
          description: Updated service point.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServicePoint' }
