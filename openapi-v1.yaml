                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/error-log:
    get:
      tags: [Admin]
      operationId: listErrorLog
      summary: Recent API errors (4xx security events and 5xx)
      x-roles: [it_admin]
      parameters:
        - name: min_status
          in: query
          schema: { type: integer, default: 403 }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Page of error entries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ErrorLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /v1/admin/clinics/{clinic_id}/analytics:
    parameters:
      - { $ref: '#/components/parameters/ClinicId' }
    get:
      tags: [Admin]
      operationId: getClinicAnalytics
      summary: Daily analytics snapshots (manager reporting)
      x-roles: [manager]
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
