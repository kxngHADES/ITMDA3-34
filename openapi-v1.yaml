        '200':
          description: Snapshots for the date range (max 92 days).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AnalyticsSnapshot' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Sync ─────────────────────────────
  /v1/sync/push:
    post:
      tags: [Sync]
      operationId: syncPush
      summary: Flush the device outbox (batch, in order)
      description: |
        The WorkManager sync worker sends queued `OutboxEntry` rows in the order they were written.
        Each item is processed independently and gets its own result, so one bad item never blocks
        the rest. The response is always `200` when the batch itself is well-formed.

        Per-item outcomes:
        - `applied` — written now.
        - `duplicate` — idempotency key already seen with the same payload; original result returned.
        - `conflict_resolved` — server copy was newer or older; last-write-wins on `client_updated_at`
          vs server `updated_at` was applied and logged.
        - `conflict_pending` — could not auto-resolve; logged to the Sync Log for the IT admin.
        - `rejected` — business rule or validation failure; the client should drop the entry and
          show `error.message`.

        Token-bucket burst capacity allows a full outbox replay after reconnecting.
      x-roles: [patient, receptionist, nurse, manager]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncPushRequest' }
      responses:
        '200':
          description: Per-item results, same order as the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPushResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /v1/sync/pull:
    get:
      tags: [Sync]
      operationId: syncPull
      summary: Changes since the device's last cursor
      description: |
        Returns the caller's own tickets plus reference data (clinics, service points) changed since
        `cursor`. Omit `cursor` for a full first sync. Store `next_cursor` in SQLite and send it next time.
        Keep calling while `has_more` is true.
      x-roles: [patient, receptionist, nurse, manager]
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Change set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncPullResponse' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Firebase ID token, verified server-side with the Admin SDK. Role from custom claim `role`.

  parameters:
    ClinicId:
      name: clinic_id
      in: path
      required: true
      schema: { type: string }
      example: clinic_soshanguve_b
    QueueId:
      name: queue_id
      in: path
      required: true
      schema: { type: string }
      example: q_soshanguve_b_general
    ServicePointId:
      name: service_point_id
      in: path
      required: true
      schema: { type: string }
      example: sp_soshanguve_b_general
    TicketId:
      name: ticket_id
      in: path
      required: true
      schema: { type: string }
      example: tkt_8Jd2kQ
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUIDv4 generated on the device when the write is first created (stored with the outbox entry).
      schema: { type: string, format: uuid }
      example: 3f1c2a9e-6b7d-4e0a-9f2b-1c8d5e7a4b60
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `next_cursor`.
      schema: { type: string }

  responses:
    TicketOk:
      description: Updated ticket.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Ticket' }
    ValidationFailed:
      description: Schema validation failed (Pydantic). Show the message, do not retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: VALIDATION_FAILED
              message: Some details are missing or not in the right format. Please check and try again.
              retryable: false
              request_id: req_01J9X2
    BusinessRule:
      description: Business rule failed. Show the plain-language reason. Retry only if `retryable`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: QUEUE_PAUSED
              message: This queue is paused for a short while. Please try again in a few minutes.
              retryable: true
              request_id: req_01J9X3
    Unauthorized:
      description: Token missing, invalid or expired. Refresh the token and retry once; show nothing.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: UNAUTHENTICATED
              message: Please sign in again.
              retryable: true
              request_id: req_01J9X4
    Forbidden:
      description: RBAC denial. Logged as a security event. Generic message, no detail; do not retry.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: FORBIDDEN
              message: Invalid details.
              retryable: false
              request_id: req_01J9X5
    NotFound:
      description: Resource not found (or not visible to the caller).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: NOT_FOUND
              message: We couldn't find that. It may have been closed or moved.
              retryable: false
              request_id: req_01J9X6
    RateLimited:
      description: Too many requests. Wait `Retry-After` seconds.
      headers:
        Retry-After:
          schema: { type: integer }
          description: Seconds until a token is available.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: RATE_LIMITED
              message: Please wait a moment before trying again.
              retryable: true
              retry_after_seconds: 12
              request_id: req_01J9X7
    ServerError:
      description: Server or database error. The device keeps the write in its outbox and retries (Table 12).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            error:
              code: SERVER_ERROR
              message: We couldn't reach the server. Your place is saved.
              retryable: true
              request_id: req_01J9X8

  schemas:
    # ---------- enums ----------
    Role:
      type: string
      enum: [patient, receptionist, nurse, manager, it_admin]
    StaffRole:
      type: string
      enum: [receptionist, nurse, manager, it_admin]
    TicketStatus:
      type: string
      enum: [waiting, called, served, no_show, cancelled]
    PriorityCategory:
      type: string
      description: The five allowed values (Ch. 3 schema validation). `none` means standard FIFO.
      enum: [none, elderly, pregnant, disability, urgent]
    JoinChannel:
      type: string
      enum: [app, sms, staff_assisted]
    NotificationChannel:
      type: string
      enum: [push, sms, whatsapp, none]
    QueueStatus:
      type: string
      enum: [open, paused, closed]
    LanguageCode:
      type: string
      description: ISO 639 code, chosen on the first screen.
      pattern: '^[a-z]{2,3}$'
      examples: [en, zu, nso, af]
    SyncLogStatus:
      type: string
      enum: [applied, duplicate, conflict_resolved, conflict_pending, resolved, rejected]
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - RATE_LIMITED
        - SERVER_ERROR
        - CLINIC_CLOSED
        - SERVICE_POINT_INACTIVE
        - QUEUE_PAUSED
        - QUEUE_EMPTY
        - INVALID_TRANSITION
        - ALREADY_CANCELLED
        - TICKET_CLOSED
        - IDEMPOTENCY_KEY_REUSED
        - CROSS_CLINIC_TRANSFER
        - CANNOT_DEACTIVATE_SELF
        - EMAIL_IN_USE
        - CONFLICT_ALREADY_RESOLVED
        - DATE_RANGE_TOO_LARGE
        - CURSOR_EXPIRED
        - QUEUE_CLOSED
        - QUEUE_ALREADY_OPEN
        - QUEUE_NOT_EMPTY
        - QUEUE_HAS_TICKETS
        - TICKET_STILL_ACTIVE

    # ---------- errors ----------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
    ErrorBody:
      type: object
      required: [code, message, retryable, request_id]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          description: Plain-language text safe to show the user. Never contains field names or codes.
        retryable: { type: boolean }
        retry_after_seconds: { type: integer }
        request_id:
          type: string
          description: For support and the error log; not shown to patients.

    # ---------- common ----------
    Page:
      type: object
      required: [has_more]
      properties:
        next_cursor: { type: ['string', 'null'] }
        has_more: { type: boolean }
    WaitRange:
      type: object
      description: 'Displayed as "16–24 minutes". ±20% of ceil(position / concurrent_servers) × B(sp).'
      required: [min_minutes, max_minutes, cold_start]
      properties:
        min_minutes: { type: integer, example: 16 }
        max_minutes: { type: integer, example: 24 }
        cold_start:
          type: boolean
          description: True while fewer than 5 samples exist and the configured default base time is used.

    # ---------- identity ----------
    Me:
      type: object
      required: [uid, role, is_anonymous, permissions]
      properties:
        uid: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        is_anonymous: { type: boolean }
        clinic_id: { type: ['string', 'null'] }
        display_name: { type: ['string', 'null'] }
        permissions:
          type: array
          description: Derived from Table 11, so clients can show or hide menus.
          items:
            type: string
            enum:
              - ticket.own.join
              - ticket.own.cancel
              - ticket.own.view
              - queue.view
              - queue.call_next
              - queue.pause
              - ticket.priority.view
              - analytics.view
              - staff.manage
              - sync.manage

    # ---------- clinics / queues ----------
    Clinic:
      type: object
      required: [id, name, is_open]
      properties:
        id: { type: string }
        name: { type: string, example: Soshanguve Block B Clinic }
        address: { type: string }
        is_open:
          type: boolean
          description: Computed from `opening_hours` and the current time in Africa/Johannesburg.
        is_active:
          type: boolean
          description: False once an admin deactivates the clinic.
        opening_hours:
          type: array
          items:
            type: object
            required: [day, opens, closes]
            properties:
              day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
              opens: { type: string, example: '07:00' }
              closes: { type: string, example: '16:00' }
        updated_at: { type: string, format: date-time }
    ServicePoint:
      type: object
      required: [id, clinic_id, name, is_active, queue_id]
      properties:
        id: { type: string }
        clinic_id: { type: string }
        name: { type: string, example: General consultation }
        icon:
          type: string
          description: Icon key from the shared icon set (icon + label, never one alone).
          example: stethoscope
        is_active: { type: boolean }
        queue_id:
          type: ['string', 'null']
          description: Today's open or paused queue; null until staff open one.
        concurrent_servers: { type: integer, minimum: 1, default: 1 }
        updated_at: { type: string, format: date-time }
    Queue:
      type: object
      required: [id, service_point_id, clinic_id, service_date, display_prefix, status, waiting_count, entries, updated_at]
      properties:
        id: { type: string }
        service_point_id: { type: string }
        clinic_id: { type: string }
        service_date: { type: string, format: date }
        display_prefix: { type: string, example: A }
        status: { $ref: '#/components/schemas/QueueStatus' }
        concurrent_servers: { type: integer, minimum: 1 }
        counter_labels:
          type: array
          items: { type: string, maxLength: 20 }
          example: [Room 1, Room 2]
        note: { type: ['string', 'null'], maxLength: 140 }
        opened_by: { type: ['string', 'null'] }
        opened_at: { type: ['string', 'null'], format: date-time }
        closed_at: { type: ['string', 'null'], format: date-time }
        pause_reason: { type: ['string', 'null'] }
        now_serving:
          type: ['string', 'null']
          description: Display number of the most recently called ticket.
          example: A013
        waiting_count: { type: integer }
        base_service_seconds:
          type: integer
          description: Current B(sp) from the EMA, or the default during cold start.
        entries:
          type: array
          items: { $ref: '#/components/schemas/QueueEntry' }
        updated_at: { type: string, format: date-time }
    QueueEntry:
      type: object
      required: [ticket_id, display_number, position, status, is_priority, late_flag]
      properties:
        ticket_id: { type: string }
        display_number: { type: string, example: A014 }
        position:
          type: integer
          minimum: 1
          description: 1-based effective position after recompute.
        status: { $ref: '#/components/schemas/TicketStatus' }
        is_priority:
          type: boolean
          description: Neutral flag for the icon. True only when a category is confirmed.
        late_flag: { type: boolean }
        protected:
          type: boolean
          description: Waited past `starvation_threshold_w_minutes`; staff only.
        display_name:
          type: ['string', 'null']
          description: Staff only. Omitted for patients.
        priority_category:
          description: Staff only.
          $ref: '#/components/schemas/PriorityCategory'
        staff_confirmed:
          type: boolean
          description: Staff only.
        joined_at: { type: string, format: date-time }
    QueueConfig:
      type: object
      description: Table 8. Missing fields fall back to defaults.
      required: [priority_weights, priority_max_jump_k, starvation_threshold_w_minutes, late_requeue_penalty_p, default_base_time_seconds]
      properties:
        priority_weights:
          type: object
          required: [elderly, pregnant, disability, urgent]
          properties:
            elderly: { type: integer, minimum: 0, default: 3 }
            pregnant: { type: integer, minimum: 0, default: 3 }
            disability: { type: integer, minimum: 0, default: 3 }
            urgent: { type: integer, minimum: 0, default: 6 }
        priority_max_jump_k: { type: integer, minimum: 0, default: 10 }
        starvation_threshold_w_minutes: { type: integer, minimum: 1, default: 100 }
        late_requeue_penalty_p: { type: integer, minimum: 0, default: 5 }
        default_base_time_seconds: { type: integer, minimum: 60, default: 900 }
        ema_alpha: { type: number, minimum: 0.01, maximum: 1, default: 0.2 }
        min_samples_for_ema: { type: integer, minimum: 1, default: 5 }

    # ---------- tickets ----------
    Ticket:
      type: object
      required: [id, display_number, sequence_no, queue_id, service_point_id, clinic_id, status, channel, priority, late_flag, created_at, updated_at]
      properties:
        id: { type: string }
        display_number: { type: string, example: A014 }
        sequence_no: { type: integer, example: 14 }
        queue_id: { type: string }
        service_point_id: { type: string }
        clinic_id: { type: string }
        status: { $ref: '#/components/schemas/TicketStatus' }
        channel: { $ref: '#/components/schemas/JoinChannel' }
        position:
          type: ['integer', 'null']
          description: Effective position while `waiting`; null otherwise.
        people_ahead: { type: ['integer', 'null'] }
        estimated_wait:
          oneOf:
            - $ref: '#/components/schemas/WaitRange'
            - type: 'null'
        counter_label:
          type: ['string', 'null']
          description: Where to go once called.
        priority:
          type: object
          required: [requested_category, staff_confirmed]
          properties:
            requested_category: { $ref: '#/components/schemas/PriorityCategory' }
            staff_confirmed: { type: boolean }
            confirmed_by: { type: ['string', 'null'] }
            confirmed_at: { type: ['string', 'null'], format: date-time }
        late_flag: { type: boolean }
        display_name: { type: ['string', 'null'] }
        phone_last4:
          type: ['string', 'null']
          description: Full number is encrypted at rest and never returned.
          example: '4821'
        notification_channel: { $ref: '#/components/schemas/NotificationChannel' }
        language: { $ref: '#/components/schemas/LanguageCode' }
        consultation_seconds: { type: ['integer', 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        called_at: { type: ['string', 'null'], format: date-time }
        closed_at: { type: ['string', 'null'], format: date-time }
    JoinQueueRequest:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        display_name:
          type: string
          maxLength: 40
          description: Optional first name or nickname shown to staff. No surname needed (POPIA minimisation).
        phone:
          type: string
          pattern: '^\+27[0-9]{9}$'
          description: Optional, only for SMS/WhatsApp alerts. Encrypted before storage.
        language: { $ref: '#/components/schemas/LanguageCode' }
        notification_channel:
          $ref: '#/components/schemas/NotificationChannel'
        priority_request:
          $ref: '#/components/schemas/PriorityCategory'
        client_created_at:
          type: string
          format: date-time
          description: When the patient tapped Join on the device (may be earlier if joined offline).
    UpdateTicketRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 40 }
        phone: { type: ['string', 'null'], pattern: '^\+27[0-9]{9}$' }
        notification_channel: { $ref: '#/components/schemas/NotificationChannel' }
        language: { $ref: '#/components/schemas/LanguageCode' }
        priority_request: { $ref: '#/components/schemas/PriorityCategory' }
    WalkInRequest:
      type: object
      required: [language]
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 40 }
        phone: { type: string, pattern: '^\+27[0-9]{9}$' }
        language: { $ref: '#/components/schemas/LanguageCode' }
        notification_channel: { $ref: '#/components/schemas/NotificationChannel' }
        priority_category:
          $ref: '#/components/schemas/PriorityCategory'
          description: Staff-entered, so it is confirmed immediately.

    # ---------- admin ----------
    PushTokenRequest:
      type: object
      required: [device_id, token, platform]
      additionalProperties: false
      properties:
        device_id:
          type: string
          description: Stable install id (same one used by sync).
        token: { type: string, description: FCM registration token. }
        platform: { type: string, enum: [android, web] }
    NotificationLogEntry:
      type: object
      required: [id, ticket_id, channel, kind, status, created_at]
      properties:
        id: { type: string }
        ticket_id: { type: string }
        channel: { $ref: '#/components/schemas/NotificationChannel' }
        kind:
          type: string
          enum: [joined, almost_your_turn, called, recalled, queue_paused, queue_closed, priority_requested]
        status: { type: string, enum: [queued, sent, delivered, failed] }
        fallback_of:
          type: ['string', 'null']
          description: Id of the failed push this SMS replaced.
        error: { type: ['string', 'null'] }
        created_at: { type: string, format: date-time }
    OpenQueueRequest:
      type: object
      additionalProperties: false
      properties:
        display_prefix:
          type: string
          pattern: '^[A-Z]{1,2}$'
          default: A
        concurrent_servers: { type: integer, minimum: 1, maximum: 20 }
        counter_labels:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 20 }
        note: { type: string, maxLength: 140 }
    UpdateQueueRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        concurrent_servers: { type: integer, minimum: 1, maximum: 20 }
        counter_labels:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 20 }
        note: { type: ['string', 'null'], maxLength: 140 }
    OpeningHours:
      type: array
      items:
        type: object
        required: [day, opens, closes]
        properties:
          day: { type: string, enum: [mon, tue, wed, thu, fri, sat, sun] }
          opens: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '07:00' }
          closes: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '16:00' }
    CreateClinicRequest:
      type: object
      required: [name, address, opening_hours]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        address: { type: string, maxLength: 200 }
        opening_hours: { $ref: '#/components/schemas/OpeningHours' }
    UpdateClinicRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 80 }
        address: { type: string, maxLength: 200 }
        opening_hours: { $ref: '#/components/schemas/OpeningHours' }
        is_active: { type: boolean }
    CreateServicePointRequest:
      type: object
      required: [name, icon]
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 60 }
        icon: { type: string, maxLength: 40, example: stethoscope }
        concurrent_servers: { type: integer, minimum: 1, maximum: 20, default: 1 }
    UpdateServicePointRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, maxLength: 60 }
        icon: { type: string, maxLength: 40 }
        concurrent_servers: { type: integer, minimum: 1, maximum: 20 }
        is_active: { type: boolean }
    StaffAccount:
      type: object
      required: [id, email, display_name, role, clinic_id, is_active, created_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        role: { $ref: '#/components/schemas/StaffRole' }
        clinic_id: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_sign_in_at: { type: ['string', 'null'], format: date-time }
    CreateStaffRequest:
      type: object
      required: [email, display_name, role, clinic_id]
      additionalProperties: false
      properties:
        email: { type: string, format: email }
        display_name: { type: string, maxLength: 60 }
        role: { $ref: '#/components/schemas/StaffRole' }
        clinic_id: { type: string }
    UpdateStaffRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        display_name: { type: string, maxLength: 60 }
        role: { $ref: '#/components/schemas/StaffRole' }
        clinic_id: { type: string }
        is_active: { type: boolean }
    SyncLogEntry:
      type: object
      required: [id, device_uid, entity_type, entity_id, op, status, created_at]
      properties:
        id: { type: string }
        device_uid: { type: string }
        clinic_id: { type: ['string', 'null'] }
        idempotency_key: { type: string, format: uuid }
        entity_type: { type: string, enum: [ticket] }
        entity_id: { type: ['string', 'null'] }
        op: { $ref: '#/components/schemas/SyncOp' }
        status: { $ref: '#/components/schemas/SyncLogStatus' }
        attempt: { type: integer, minimum: 1 }
        conflict:
          type: ['object', 'null']
          properties:
            client_value: { type: object }
            server_value: { type: object }
            client_updated_at: { type: string, format: date-time }
            server_updated_at: { type: string, format: date-time }
        resolution: { type: ['string', 'null'], enum: [last_write_wins, keep_server, apply_client, discard, null] }
        resolved_by: { type: ['string', 'null'] }
        resolved_at: { type: ['string', 'null'], format: date-time }
        created_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, actor_id, actor_role, action, outcome, created_at]
      properties:
        id: { type: string }
        actor_id: { type: string }
        actor_role: { $ref: '#/components/schemas/Role' }
        action:
          type: string
          example: ticket.call_next
        target_type: { type: string, example: ticket }
        target_id: { type: string }
        outcome: { type: string, enum: [success, denied, failed] }
        created_at: { type: string, format: date-time }
    ErrorLogEntry:
      type: object
      required: [id, request_id, status, code, path, created_at]
      properties:
        id: { type: string }
        request_id: { type: string }
        status: { type: integer }
        code: { $ref: '#/components/schemas/ErrorCode' }
        method: { type: string }
        path: { type: string }
        actor_id: { type: ['string', 'null'] }
        detail:
          type: string
          description: Internal detail for IT admin only. Never sent to clients in normal responses.
        created_at: { type: string, format: date-time }
    AnalyticsSnapshot:
      type: object
      required: [clinic_id, date]
      properties:
        clinic_id: { type: string }
        date: { type: string, format: date }
        tickets_joined: { type: integer }
        tickets_served: { type: integer }
        no_shows: { type: integer }
        cancellations: { type: integer }
        avg_wait_minutes: { type: number }
        p90_wait_minutes: { type: number }
        peak_hour:
          type: integer
          minimum: 0
          maximum: 23
        joins_by_channel:
          type: object
          additionalProperties: { type: integer }
        calls_per_staff:
          type: array
          items:
            type: object
            properties:
              staff_id: { type: string }
              calls: { type: integer }

    # ---------- sync ----------
    SyncOp:
      type: string
      description: Outbox operations the Android apps can replay.
      enum: [join, update_ticket, cancel]
    OutboxItem:
      type: object
      required: [idempotency_key, op, client_updated_at, payload]
      additionalProperties: false
      properties:
        idempotency_key: { type: string, format: uuid }
        op: { $ref: '#/components/schemas/SyncOp' }
        queue_id:
          type: string
          description: Required for `join`.
        ticket_id:
          type: string
          description: Required for `update_ticket` and `cancel`. For a ticket created offline, use the `local_ref` of its join item.
        local_ref:
          type: string
          description: Device-local ticket id (SQLite row) so later items in the same batch can refer to an offline-created ticket.
        client_updated_at: { type: string, format: date-time }
        attempt:
          type: integer
          minimum: 1
          description: Retry count from the outbox (Table 12), logged in the Sync Log.
        payload:
          description: Same body as the matching REST endpoint.
          oneOf:
            - $ref: '#/components/schemas/JoinQueueRequest'
            - $ref: '#/components/schemas/UpdateTicketRequest'
            - type: object
              maxProperties: 0
    SyncPushRequest:
      type: object
      required: [device_id, items]
      properties:
        device_id:
          type: string
          description: Stable install id (not the IMEI). Used for the per-device rate-limit bucket.
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/OutboxItem' }
    SyncItemResult:
      type: object
      required: [idempotency_key, outcome]
      properties:
        idempotency_key: { type: string, format: uuid }
        local_ref: { type: ['string', 'null'] }
        outcome:
          type: string
          enum: [applied, duplicate, conflict_resolved, conflict_pending, rejected]
        ticket:
          oneOf:
            - $ref: '#/components/schemas/Ticket'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/ErrorBody'
            - type: 'null'
    SyncPushResponse:
      type: object
      required: [results, server_time]
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SyncItemResult' }
        server_time: { type: string, format: date-time }
    SyncPullResponse:
      type: object
      required: [next_cursor, has_more, tickets, clinics, service_points, server_time]
      properties:
        next_cursor: { type: string }
        has_more: { type: boolean }
        tickets:
          type: array
          items: { $ref: '#/components/schemas/Ticket' }
        clinics:
          type: array
          items: { $ref: '#/components/schemas/Clinic' }
        service_points:
          type: array
          items: { $ref: '#/components/schemas/ServicePoint' }
        queue_configs:
          type: array
          description: Staff only.
          items:
            allOf:
              - $ref: '#/components/schemas/QueueConfig'
              - type: object
                properties:
                  queue_id: { type: string }
        server_time: { type: string, format: date-time }
