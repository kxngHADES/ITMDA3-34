        schema: { type: string }
    get:
      tags: [Admin]
      operationId: getStaff
      summary: Get a staff account
      x-roles: [it_admin]
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccount' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      operationId: updateStaff
      summary: Update name, role, clinic or reactivate
      x-roles: [it_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStaffRequest' }
      responses:
        '200':
          description: Updated account. A role change revokes the user's refresh tokens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAccount' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
