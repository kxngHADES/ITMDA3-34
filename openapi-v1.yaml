      x-roles: [it_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                resolution:
                  type: string
                  enum: [keep_server, apply_client, discard]
                note:
                  type: string
                  maxLength: 280
      responses:
        '200':
          description: Entry resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncLogEntry' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/admin/audit-log:
    get:
      tags: [Admin]
      operationId: listAuditLog
      summary: Staff action audit trail
      x-roles: [it_admin]
      parameters:
