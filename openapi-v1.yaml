openapi: 3.1.0
info:
  title: SwiftQ DQMS API
  version: 1.0.0
  summary: Digital Queue Management System for public clinics (ITMDA3-34, Group 2)
  description: |
    Contract v1 for the SwiftQ FastAPI backend. One contract shared by the patient app (Android),
    staff mobile app (Android), staff web app and admin web app (Next.js).

    **Traceability to Chapter 3**
    - Roles and permissions follow Table 11 (TBAC). Every operation lists its allowed roles in `x-roles`.
    - Error shapes and status codes follow Table 13 (Server-side Exceptions).
    - Queue rules follow Table 8 (Queue Configuration) and the weighted FIFO-priority merge.
    - Offline sync follows §3.3.2 and Table 12 (backoff schedule), with UUIDv4 idempotency keys.

    **Authentication.** Every `/v1` call needs a Firebase ID token: `Authorization: Bearer <token>`.
    Patients use anonymous Firebase Auth (no login screen). Staff sign in with email and password.
    The caller's role comes from the verified token's custom claims, never from a request field.

    **Ticket state machine** (Figure 15)
    ```
    waiting ──call-next──▶ called ──serve──▶ served      (terminal)
       │                     │──no-show──▶ no_show ──return-late──▶ waiting (late_flag = true)
       │                     └──dismiss──▶ cancelled   (terminal)
       └──cancel / dismiss──▶ cancelled                 (terminal)
    ```
    Any other transition returns `400 INVALID_TRANSITION`.

    **Queue lifecycle** (one queue per service point per day, staff web W8)
    ```
    (none) ──open──▶ open ⇄ paused ──close──▶ closed      DELETE only while it has no tickets
    ```

    **Push notifications.** Every app registers its FCM token with `PUT /v1/me/push-token` after
    sign-in and removes it with `DELETE /v1/me/push-token` on logout. The Notification Manager sends
    FCM first and falls back to SMS; every attempt is written to the NotificationLog.

    **Idempotency.** Every patient write and every sync item carries a UUIDv4 `Idempotency-Key`.
    Same key + same payload → `200` with the original result. Same key + different payload →
    `400 IDEMPOTENCY_KEY_REUSED`. Keys live in a shared Redis store (`SETNX`, 24 h TTL): Upstash or
    Render Key Value, decided 15 Oct (PM plan task A7). The contract is the same either way.

    **Rate limits** (token bucket, fail-open, same Redis store). Join: 5/min per device UID (burst 5) plus a per-IP cap.
    Call next: 60/min per staff account. `429` responses carry `Retry-After`.

    **Live updates.** The API is the only writer. After every queue change it publishes the queue
    snapshot (the `Queue` schema) to Firestore at `live_queues/{queue_id}`, which clients may listen to
    read-only. `GET /v1/queues/{queue_id}` supports `ETag` / `If-None-Match` for a polling fallback.
    *Final mechanism is pending spike T-03.8; this contract does not change either way.*

    **Conventions.** JSON field names are `snake_case`. Timestamps are ISO-8601 UTC.
    IDs are opaque strings (Firestore document IDs). List endpoints use cursor pagination.
  contact:
    name: Ndaedzo Mudau (API owner, integration lead)
  x-plan: SwiftQ PM Plan v1.3, task S3 (contract frozen and mock server live, Wed 7 Oct 2026)
servers:
  - url: https://swiftq-api-prod.onrender.com
    description: Production (Render) — demo and submission build
  - url: https://swiftq-api-dev.onrender.com
    description: Development (Render) — integration testing; use this while building
  - url: http://localhost:8000
    description: Local (uvicorn)

security:
  - firebaseAuth: []

tags:
  - name: Meta
    description: Health, caller identity and push-token registration.
  - name: Queues
    description: Clinics, service points, the day's queue (open, edit, close, delete), live snapshots and queue control.
  - name: Tickets
    description: Patient-side ticket lifecycle (join, track, update, leave, clear from history).
  - name: Staff
    description: Counter actions on tickets (call next, serve, no-show, priority confirmation, walk-ins, transfer).
  - name: Admin
    description: Admin web app — clinic and service point setup, staff accounts, sync log, conflicts, audit and error logs, and manager analytics.
  - name: Sync
    description: Offline outbox push and change pull for the Android apps.

paths:
  # ───────────────────────────── Meta ─────────────────────────────
  /health:
    get:
      tags: [Meta]
      operationId: getHealth
      summary: Liveness check (no auth)
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, enum: [ok] }
                  version: { type: string, example: 1.0.0 }
                  environment: { type: string, example: production }

  /v1/me:
    get:
      tags: [Meta]
      operationId: getMe
      summary: Who am I (role and permissions from the verified token)
      x-roles: [patient, receptionist, nurse, manager, it_admin]
      responses:
        '200':
          description: Caller identity.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/me/push-token:
    put:
      tags: [Meta]
      operationId: registerPushToken
      summary: Register or refresh this device's FCM push token
      description: |
        Call after sign-in and whenever Firebase issues a new token. One token per device per user;
        sending the same token again is a no-op. Staff tokens receive priority-request alerts (M5);
        patient tokens receive "your turn" and 5-minute alerts (P6).
      x-roles: [patient, receptionist, nurse, manager, it_admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushTokenRequest' }
      responses:
        '204':
          description: Token saved.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Meta]
      operationId: removePushToken
      summary: Remove this device's push token (call on logout)
      x-roles: [patient, receptionist, nurse, manager, it_admin]
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Token removed (also returned if it was never registered).
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ───────────────────────────── Queues ─────────────────────────────
  /v1/clinics:
    get:
      tags: [Queues]
      operationId: listClinics
      summary: List clinics
      x-roles: [patient, receptionist, nurse, manager, it_admin]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Page of clinics.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Clinic' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/clinics/{clinic_id}:
    parameters:
      - { $ref: '#/components/parameters/ClinicId' }
    get:
      tags: [Queues]
      operationId: getClinic
      summary: Get a clinic
      x-roles: [patient, receptionist, nurse, manager, it_admin]
      responses:
        '200':
          description: The clinic.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Clinic' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/clinics/{clinic_id}/service-points:
    parameters:
      - { $ref: '#/components/parameters/ClinicId' }
    get:
      tags: [Queues]
      operationId: listServicePoints
      summary: List a clinic's service points (each has exactly one queue)
      x-roles: [patient, receptionist, nurse, manager, it_admin]
      parameters:
        - name: active
          in: query
          description: Only return active service points (default for patients).
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Service points.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ServicePoint' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/service-points/{service_point_id}/queues:
    parameters:
      - { $ref: '#/components/parameters/ServicePointId' }
    post:
      tags: [Queues]
      operationId: openQueue
      summary: Open today's queue for a service point
      description: |
        Creates the day's queue and sets `ServicePoint.queue_id` to it. Only one queue per service
        point can be open or paused at a time (`400 QUEUE_ALREADY_OPEN`). Ticket numbers restart at 1
        with the given `display_prefix`.
      x-roles: [receptionist, manager]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenQueueRequest' }
      responses:
        '201':
          description: Queue opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    get:
      tags: [Queues]
      operationId: listServicePointQueues
      summary: Queue history for a service point (newest first)
      x-roles: [receptionist, nurse, manager]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/QueueStatus' }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Page of queues (entries omitted; fetch one queue for its entries).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Queue' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/queues/{queue_id}:
    parameters:
      - { $ref: '#/components/parameters/QueueId' }
    patch:
      tags: [Queues]
      operationId: updateQueue
      summary: Edit an open queue (servers on duty, counter labels, note)
      x-roles: [receptionist, manager]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateQueueRequest' }
      responses:
        '200':
          description: Updated queue. Wait estimates are recomputed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Queues]
      operationId: deleteQueue
      summary: Delete a queue opened by mistake
      description: Only allowed while the queue has never had a ticket (`400 QUEUE_HAS_TICKETS`). Otherwise close it.
      x-roles: [receptionist, manager]
      responses:
        '204':
          description: Queue deleted; `ServicePoint.queue_id` is cleared.
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [Queues]
      operationId: getQueue
      summary: Live queue snapshot in effective order
      description: |
        Returns the queue after `recompute_effective_queue`. The response is shaped by role:
        patients get anonymised entries (display number, position, neutral `is_priority` flag only);
        `display_name`, `priority_category` and `staff_confirmed` are omitted for patients (Table 11).
        Supports `If-None-Match` → `304` for polling.
      x-roles: [patient, receptionist, nurse, manager, it_admin]
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Queue snapshot.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        '304':
          description: Not modified since the given ETag.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/queues/{queue_id}/close:
    parameters:
      - { $ref: '#/components/parameters/QueueId' }
    post:
      tags: [Queues]
      operationId: closeQueue
      summary: Close the queue at the end of the day
      description: |
        Status becomes `closed` and no more joins are accepted. If tickets are still `waiting` or
        `called`, the request fails with `400 QUEUE_NOT_EMPTY` unless `cancel_remaining` is true, in which
        case they are cancelled and the patients are notified.
      x-roles: [receptionist, manager]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                cancel_remaining: { type: boolean, default: false }
                message:
                  type: string
                  maxLength: 140
                  description: Sent to patients whose tickets are cancelled.
                  example: The clinic has closed for today. Please come back tomorrow from 07:00.
      responses:
        '200':
          description: Queue closed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/queues/{queue_id}/pause:
    parameters:
      - { $ref: '#/components/parameters/QueueId' }
    post:
      tags: [Queues]
      operationId: pauseQueue
      summary: Pause a queue (joins rejected, call-next blocked)
      x-roles: [receptionist, manager]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 140
                  example: Staff tea break, back at 10:30
      responses:
        '200':
          description: Queue paused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/queues/{queue_id}/resume:
    parameters:
      - { $ref: '#/components/parameters/QueueId' }
    post:
      tags: [Queues]
      operationId: resumeQueue
      summary: Resume a paused queue
      x-roles: [receptionist, manager]
      responses:
        '200':
          description: Queue open again.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Queue' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/queues/{queue_id}/config:
    parameters:
      - { $ref: '#/components/parameters/QueueId' }
    get:
      tags: [Queues]
      operationId: getQueueConfig
      summary: Queue configuration (Table 8)
      x-roles: [receptionist, nurse, manager]
      responses:
        '200':
          description: Current configuration (defaults applied).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Queues]
      operationId: updateQueueConfig
      summary: Replace queue configuration
      x-roles: [manager]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QueueConfig' }
      responses:
        '200':
          description: Saved. The queue is recomputed immediately.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QueueConfig' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  # ───────────────────────────── Tickets (patient) ─────────────────────────────
  /v1/queues/{queue_id}/tickets:
    parameters:
      - { $ref: '#/components/parameters/QueueId' }
    post:
      tags: [Tickets]
      operationId: joinQueue
      summary: Join a queue (create ticket)
      description: |
        Creates a ticket with the next sequence number. If this device already holds an active ticket
        (`waiting` or `called`) at this clinic, the existing ticket is returned with `200` instead of
        creating a second one (T-03.2).

        Business-rule failures (`400`): `CLINIC_CLOSED`, `SERVICE_POINT_INACTIVE`, `QUEUE_PAUSED`,
        `QUEUE_CLOSED`.
        A `priority_request` is stored but does **not** move the ticket until staff confirm it.
      x-roles: [patient]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinQueueRequest' }
      responses:
        '201':
          description: Ticket created.
          headers:
            Location:
              schema: { type: string, example: /v1/tickets/tkt_8Jd2 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '200':
          description: Existing active ticket, or replay of the same idempotency key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    get:
      tags: [Staff]
      operationId: listQueueTickets
      summary: List tickets in a queue (staff view)
      x-roles: [receptionist, nurse, manager]
      parameters:
        - name: status
          in: query
          description: Filter by one or more statuses. Defaults to `waiting,called`.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/TicketStatus' }
        - name: search
          in: query
          description: Patient search (W9). Matches display number (e.g. `A014`), first name, or last 4 phone digits.
          schema: { type: string, minLength: 2, maxLength: 40 }
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Tickets in effective order (waiting) then by updated time.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/tickets/mine:
    get:
      tags: [Tickets]
      operationId: listMyTickets
      summary: The calling device's tickets
      x-roles: [patient]
      parameters:
        - name: active
          in: query
          description: Only `waiting` and `called` tickets. Use `false` for the history screen (P8).
          schema: { type: boolean, default: true }
      responses:
        '200':
          description: Tickets owned by the caller's Firebase UID.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /v1/tickets/{ticket_id}:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    get:
      tags: [Tickets]
      operationId: getTicket
      summary: Get a ticket with live position and wait range
      description: Patients may only read their own tickets; anything else returns `404` (no existence leak).
      x-roles: [patient, receptionist, nurse, manager]
      responses:
        '200':
          description: The ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Tickets]
      operationId: updateTicket
      summary: Update own ticket preferences or request priority
      description: |
        Only the fields below can change. Requesting or changing `priority_request` resets
        `staff_confirmed` to `false`. Not allowed once the ticket is terminal (`400 TICKET_CLOSED`).
      x-roles: [patient]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTicketRequest' }
      responses:
        '200':
          description: Updated ticket.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }
    delete:
      tags: [Tickets]
      operationId: deleteTicketFromHistory
      summary: Remove a finished ticket from the patient's history
      description: |
        Patient app CRUD delete (P8, expired-ticket cleanup). Only `served`, `no_show` or `cancelled`
        tickets can be removed (`400 TICKET_STILL_ACTIVE` otherwise). The ticket is hidden from
        `GET /v1/tickets/mine`; the clinic's record and analytics are kept.
      x-roles: [patient]
      responses:
        '204':
          description: Removed from history.
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/tickets/{ticket_id}/notifications:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    get:
      tags: [Tickets]
      operationId: listTicketNotifications
      summary: Notifications sent for a ticket (NotificationLog)
      description: Patients see their own ticket's alerts; staff see any ticket at their clinic.
      x-roles: [patient, receptionist, nurse, manager]
      responses:
        '200':
          description: Newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/NotificationLogEntry' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/tickets/{ticket_id}/cancel:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    post:
      tags: [Tickets]
      operationId: cancelTicket
      summary: Leave the queue (patient cancels own ticket)
      description: Everyone behind moves up one place. Cancelling twice returns `400 ALREADY_CANCELLED`.
      x-roles: [patient]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200':
          description: Ticket cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ───────────────────────────── Staff actions ─────────────────────────────
  /v1/queues/{queue_id}/call-next:
    parameters:
      - { $ref: '#/components/parameters/QueueId' }
    post:
      tags: [Staff]
      operationId: callNext
      summary: Call the first ticket in effective order
      description: |
        Moves the head of the effective queue from `waiting` to `called` and triggers the patient
        notification. `400 QUEUE_EMPTY` when nobody is waiting, `400 QUEUE_PAUSED` when paused.
      x-roles: [receptionist, nurse, manager]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                counter_label:
                  type: string
                  maxLength: 20
                  description: Shown to the patient, e.g. which room to go to.
                  example: Room 3
      responses:
        '200':
          description: The ticket that was called.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /v1/queues/{queue_id}/walk-ins:
    parameters:
      - { $ref: '#/components/parameters/QueueId' }
    post:
      tags: [Staff]
      operationId: addWalkIn
      summary: Manually add a walk-in patient (staff-assisted join)
      x-roles: [receptionist]
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WalkInRequest' }
      responses:
        '201':
          description: Ticket created with `channel = staff_assisted`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/tickets/{ticket_id}/recall:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    post:
      tags: [Staff]
      operationId: recallTicket
      summary: Call an already-called ticket again (re-sends the notification)
      x-roles: [receptionist, nurse, manager]
      responses:
        '200': { $ref: '#/components/responses/TicketOk' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/tickets/{ticket_id}/serve:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    post:
      tags: [Staff]
      operationId: serveTicket
      summary: Mark a called ticket as served
      description: Records `consultation_seconds`, which feeds the EMA base service time (α = 0.2).
      x-roles: [receptionist, nurse, manager]
      responses:
        '200': { $ref: '#/components/responses/TicketOk' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/tickets/{ticket_id}/no-show:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    post:
      tags: [Staff]
      operationId: markNoShow
      summary: Mark a called ticket as a no-show
      x-roles: [receptionist, nurse, manager]
      responses:
        '200': { $ref: '#/components/responses/TicketOk' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/tickets/{ticket_id}/return-late:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    post:
      tags: [Staff]
      operationId: returnLate
      summary: Re-queue a no-show who came back late
      description: Status goes `no_show → waiting` with `late_flag = true`; pushed back by `late_requeue_penalty_p`.
      x-roles: [receptionist, nurse, manager]
      responses:
        '200': { $ref: '#/components/responses/TicketOk' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/tickets/{ticket_id}/dismiss:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    post:
      tags: [Staff]
      operationId: dismissTicket
      summary: Staff removes a waiting or called ticket
      x-roles: [receptionist, nurse, manager]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [duplicate, wrong_service_point, patient_left, expired, other]
                  description: '`expired` is the staff mobile "expire ticket" action (M7).'
                note:
                  type: string
                  maxLength: 140
      responses:
        '200': { $ref: '#/components/responses/TicketOk' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/tickets/{ticket_id}/confirm-priority:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    post:
      tags: [Staff]
      operationId: confirmPriority
      summary: Confirm or reject a patient's priority request
      description: |
        Sets `staff_confirmed`. Only a confirmed category affects position (bounded by
        `priority_max_jump_k`, never passing starvation-protected tickets). Staff may also correct the
        category on confirmation.
      x-roles: [receptionist, nurse, manager]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed: { type: boolean }
                category: { $ref: '#/components/schemas/PriorityCategory' }
      responses:
        '200': { $ref: '#/components/responses/TicketOk' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /v1/tickets/{ticket_id}/transfer:
    parameters:
      - { $ref: '#/components/parameters/TicketId' }
    post:
      tags: [Staff]
      operationId: transferTicket
      summary: Move a waiting ticket to another service point at the same clinic
      description: The ticket keeps its original `joined_at`, so starvation protection carries over.
      x-roles: [receptionist, nurse, manager]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_queue_id]
              properties:
                target_queue_id: { type: string }
      responses:
        '200': { $ref: '#/components/responses/TicketOk' }
        '400': { $ref: '#/components/responses/BusinessRule' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

