# Path-based PR labels, applied by .github/workflows/labeler.yml (actions/labeler v5)

api:
  - changed-files:
      - any-glob-to-any-file: "api/**"

admin-web:
  - changed-files:
      - any-glob-to-any-file: "admin-web/**"

staff-web:
  - changed-files:
      - any-glob-to-any-file: "staff-web/**"

mobile:
  - changed-files:
      - any-glob-to-any-file: "SwiftQ/**"

mobile-staff:
  - changed-files:
      - any-glob-to-any-file: "SwiftQ-Staff/**"

infra:
  - changed-files:
      - any-glob-to-any-file:
          - "docker-compose.yml"
          - "**/Dockerfile"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".github/actions/**"

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "api/docs/**"

tests:
  - changed-files:
      - any-glob-to-any-file:
          - "api/tests/**"
          - "SwiftQ/app/src/test/**"
          - "SwiftQ/app/src/androidTest/**"
          - "SwiftQ-Staff/app/src/test/**"
          - "SwiftQ-Staff/app/src/androidTest/**"

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "api/pyproject.toml"
          - "api/uv.lock"
          - "admin-web/package.json"
          - "admin-web/package-lock.json"
          - "staff-web/package.json"
          - "staff-web/package-lock.json"
          - "SwiftQ/gradle/libs.versions.toml"
          - "SwiftQ/**/build.gradle.kts"
          - "SwiftQ-Staff/gradle/libs.versions.toml"
          - "SwiftQ-Staff/**/build.gradle.kts"
