name: Deploy (prod)

# Deploys the API to Render on every push to `main` that touches it, and can
# also be run manually from the Actions tab (from `main` only).
# The run only goes green once Render reports the deploy live and /health answers.
#
# Needs a `prod` environment in repo Settings -> Environments (with
# required reviewers so prod deploys need approval) with:
#   secrets:   RENDER_API_KEY  (Render -> Account Settings -> API Keys)
#              REDIS_URL       (Upstash Redis TLS URL, rediss://...)
#   secrets, optional (notifications; a warning is shown and the feature is off when missing):
#              SMTP_USER, SMTP_PASS  (the account that sends SMS through the carrier email gateway)
#              RESEND_API_KEY
#              PHONE_ENCRYPTION_KEY  (Fernet key; when empty the app derives one from JWT_SECRET_KEY)
#   variables: RENDER_API_SERVICE_ID  (srv-... from the API service URL)
#   variables, optional (the app has defaults):
#              CARRIER_GATEWAY, SMTP_HOST, SMTP_PORT
#              RESEND_FROM_EMAIL, RESEND_FROM_NAME
#              ALMOST_TURN_POSITION, RATE_LIMIT_ENABLED, TRUSTED_PROXY_HOPS
#
# The admin web deploy is still a placeholder: add RENDER_ADMIN_WEB_DEPLOY_HOOK
# as an environment secret and uncomment its step when that service exists.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "api/**"
      - ".github/workflows/deploy-prod.yml"

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A manual run from any other branch would put unreviewed code in prod
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: prod
    env:
      RENDER_API: https://api.render.com/v1
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      PHONE_ENCRYPTION_KEY: ${{ secrets.PHONE_ENCRYPTION_KEY }}
      CARRIER_GATEWAY: ${{ vars.CARRIER_GATEWAY }}
      SMTP_HOST: ${{ vars.SMTP_HOST }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      RESEND_FROM_EMAIL: ${{ vars.RESEND_FROM_EMAIL }}
      RESEND_FROM_NAME: ${{ vars.RESEND_FROM_NAME }}
      ALMOST_TURN_POSITION: ${{ vars.ALMOST_TURN_POSITION }}
      RATE_LIMIT_ENABLED: ${{ vars.RATE_LIMIT_ENABLED }}
      TRUSTED_PROXY_HOPS: ${{ vars.TRUSTED_PROXY_HOPS }}
    steps:
      # Fail here rather than deploy an API that silently falls back to localhost Redis
      - name: Check deploy config
        run: |
          missing=0
          for name in RENDER_API_KEY RENDER_API_SERVICE_ID REDIS_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the prod environment"
              missing=1
            fi
          done
          # Notifications are optional so a missing value does not block a deploy, but say so
          for name in SMTP_USER SMTP_PASS CARRIER_GATEWAY SMTP_HOST RESEND_API_KEY \
            RESEND_FROM_EMAIL PHONE_ENCRYPTION_KEY; do
            if [ -z "${!name}" ]; then
              echo "::warning::$name is not set on the prod environment, the matching notification feature may not work"
            fi
          done
          exit "$missing"

      # Render is what the API reads its env from, so copy the values over before deploying
      - name: Sync API env vars to Render
        run: |
          set_var() {
            curl -fsS -o /dev/null -X PUT \
              "$RENDER_API/services/$RENDER_API_SERVICE_ID/env-vars/$1" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg value "$2" '{value: $value}')"
          }
          set_var ENVIRONMENT prod
          set_var REDIS_URL "$REDIS_URL"
          # Notifications, email to SMS and rate limiting, only pushed when set
          for name in SMTP_USER SMTP_PASS RESEND_API_KEY PHONE_ENCRYPTION_KEY CARRIER_GATEWAY SMTP_HOST \
            SMTP_PORT RESEND_FROM_EMAIL RESEND_FROM_NAME ALMOST_TURN_POSITION RATE_LIMIT_ENABLED \
            TRUSTED_PROXY_HOPS; do
            [ -z "${!name}" ] || set_var "$name" "${!name}"
          done

      # Deploys the commit this run was triggered for, not whatever Render's branch points at
      - name: Deploy API
        id: deploy
        run: |
          deploy=$(curl -sS --fail-with-body -X POST \
            "$RENDER_API/services/$RENDER_API_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg sha "$GITHUB_SHA" '{commitId: $sha}')") || {
            echo "::error::Render rejected the deploy: $deploy"
            exit 1
          }
          deploy_id=$(jq -r '.id // empty' <<<"$deploy")
          # Render answers without a body when it queues the deploy behind a running one
          if [ -z "$deploy_id" ]; then
            deploy_id=$(curl -fsS "$RENDER_API/services/$RENDER_API_SERVICE_ID/deploys?limit=1" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.[0].deploy.id // empty')
          fi
          if [ -z "$deploy_id" ]; then
            echo "::error::Render did not return a deploy id"
            exit 1
          fi
          echo "Started deploy $deploy_id for $GITHUB_SHA"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      # Triggering a deploy only queues it - the build can still fail on Render
      - name: Wait for deploy to go live
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          last=""
          for _ in $(seq 1 120); do
            status=$(curl -fsS "$RENDER_API/services/$RENDER_API_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status') || status="unknown"
            if [ "$status" != "$last" ]; then
              echo "Deploy status: $status"
              last=$status
            fi
            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy $DEPLOY_ID ended as $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Render deploy $DEPLOY_ID was still $last after 20 minutes"
          exit 1

      - name: Check API health
        run: |
          url=$(curl -fsS "$RENDER_API/services/$RENDER_API_SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.serviceDetails.url // empty')
          if [ -z "$url" ]; then
            echo "::error::Could not read the API URL from Render"
            exit 1
          fi
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$url/health"
          echo
          echo "Deployed \`$GITHUB_SHA\` to $url" >> "$GITHUB_STEP_SUMMARY"

      # - name: Deploy admin web
      #   run: curl -fsS -X POST "${{ secrets.RENDER_ADMIN_WEB_DEPLOY_HOOK }}"
