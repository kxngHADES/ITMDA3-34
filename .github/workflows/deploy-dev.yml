name: Deploy (dev)

# Deploys the API to Render on every push to `dev` that touches it, and can
# also be run manually from the Actions tab (deploys the branch it is run from).
# The run only goes green once Render reports the deploy live and /health answers.
#
# Needs a `dev` environment in repo Settings -> Environments with:
#   secrets:   RENDER_API_KEY  (Render -> Account Settings -> API Keys)
#              REDIS_URL       (Upstash Redis TLS URL, rediss://...)
#              JWT_SECRET_KEY
#              FIREBASE_WEB_API_KEY
#              FIREBASE_SERVICE_ACCOUNT_JSON  (full contents of the service account key)
#   variables: RENDER_API_SERVICE_ID  (srv-... from the API service URL)
#              FIREBASE_PROJECT_ID
#              FIREBASE_SERVICE_ACCOUNT_PATH  (/etc/secrets/<file>.json, where Render mounts the secret file)
#              JWT_ALGORITHM, JWT_ACCESS_TOKEN_EXPIRE_MINUTES
#              CORS_ORIGINS  (optional, comma-separated origins or *, defaults to * in the app)
#
# The admin web deploy is still a placeholder: add RENDER_ADMIN_WEB_DEPLOY_HOOK
# as an environment secret and uncomment its step when that service exists.

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "api/**"
      - ".github/workflows/deploy-dev.yml"

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: dev
    env:
      RENDER_API: https://api.render.com/v1
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${{ vars.FIREBASE_SERVICE_ACCOUNT_PATH }}
      JWT_ALGORITHM: ${{ vars.JWT_ALGORITHM }}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${{ vars.JWT_ACCESS_TOKEN_EXPIRE_MINUTES }}
      CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
    steps:
      # Fail here rather than deploy an API that silently falls back to localhost Redis
      # or boots without Firebase credentials (/health would still pass)
      - name: Check deploy config
        run: |
          missing=0
          for name in RENDER_API_KEY RENDER_API_SERVICE_ID REDIS_URL JWT_SECRET_KEY \
            FIREBASE_WEB_API_KEY FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_PROJECT_ID \
            FIREBASE_SERVICE_ACCOUNT_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the dev environment"
              missing=1
            fi
          done
          exit "$missing"

      # Render is what the API reads its env from, so copy the values over before deploying
      - name: Sync API env vars to Render
        run: |
          set_var() {
            curl -fsS -o /dev/null -X PUT \
              "$RENDER_API/services/$RENDER_API_SERVICE_ID/env-vars/$1" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg value "$2" '{value: $value}')"
          }
          set_var ENVIRONMENT dev
          set_var REDIS_URL "$REDIS_URL"
          set_var JWT_SECRET_KEY "$JWT_SECRET_KEY"
          set_var FIREBASE_WEB_API_KEY "$FIREBASE_WEB_API_KEY"
          set_var FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID"
          set_var FIREBASE_SERVICE_ACCOUNT_PATH "$FIREBASE_SERVICE_ACCOUNT_PATH"
          # Optional: only pushed when set, otherwise the app defaults apply
          [ -z "$JWT_ALGORITHM" ] || set_var JWT_ALGORITHM "$JWT_ALGORITHM"
          [ -z "$JWT_ACCESS_TOKEN_EXPIRE_MINUTES" ] || set_var JWT_ACCESS_TOKEN_EXPIRE_MINUTES "$JWT_ACCESS_TOKEN_EXPIRE_MINUTES"
          [ -z "$CORS_ORIGINS" ] || set_var CORS_ORIGINS "$CORS_ORIGINS"

          # The key file is not in git, so ship it as a Render secret file.
          # Render mounts it at /etc/secrets/<name>, which FIREBASE_SERVICE_ACCOUNT_PATH points at.
          curl -fsS -o /dev/null -X PUT \
            "$RENDER_API/services/$RENDER_API_SERVICE_ID/secret-files/$(basename "$FIREBASE_SERVICE_ACCOUNT_PATH")" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg content "$FIREBASE_SERVICE_ACCOUNT_JSON" '{content: $content}')"

      # Deploys the commit this run was triggered for, not whatever Render's branch points at
      - name: Deploy API
        id: deploy
        run: |
          deploy=$(curl -sS --fail-with-body -X POST \
            "$RENDER_API/services/$RENDER_API_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg sha "$GITHUB_SHA" '{commitId: $sha}')") || {
            echo "::error::Render rejected the deploy: $deploy"
            exit 1
          }
          deploy_id=$(jq -r '.id // empty' <<<"$deploy")
          # Render answers without a body when it queues the deploy behind a running one
          if [ -z "$deploy_id" ]; then
            deploy_id=$(curl -fsS "$RENDER_API/services/$RENDER_API_SERVICE_ID/deploys?limit=1" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.[0].deploy.id // empty')
          fi
          if [ -z "$deploy_id" ]; then
            echo "::error::Render did not return a deploy id"
            exit 1
          fi
          echo "Started deploy $deploy_id for $GITHUB_SHA"
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"

      # Triggering a deploy only queues it - the build can still fail on Render
      - name: Wait for deploy to go live
        env:
          DEPLOY_ID: ${{ steps.deploy.outputs.deploy_id }}
        run: |
          last=""
          for _ in $(seq 1 120); do
            status=$(curl -fsS "$RENDER_API/services/$RENDER_API_SERVICE_ID/deploys/$DEPLOY_ID" \
              -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.status') || status="unknown"
            if [ "$status" != "$last" ]; then
              echo "Deploy status: $status"
              last=$status
            fi
            case "$status" in
              live)
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deploy $DEPLOY_ID ended as $status"
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "::error::Render deploy $DEPLOY_ID was still $last after 20 minutes"
          exit 1

      - name: Check API health
        run: |
          url=$(curl -fsS "$RENDER_API/services/$RENDER_API_SERVICE_ID" \
            -H "Authorization: Bearer $RENDER_API_KEY" | jq -r '.serviceDetails.url // empty')
          if [ -z "$url" ]; then
            echo "::error::Could not read the API URL from Render"
            exit 1
          fi
          curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors "$url/health"
          echo
          echo "Deployed \`$GITHUB_SHA\` to $url" >> "$GITHUB_STEP_SUMMARY"

      # - name: Deploy admin web
      #   run: curl -fsS -X POST "${{ secrets.RENDER_ADMIN_WEB_DEPLOY_HOOK }}"
