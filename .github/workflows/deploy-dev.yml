name: Deploy (dev)

# Runs only when triggered manually from the Actions tab until the `push`
# trigger below is uncommented.
#
# Needs a `dev` environment in repo Settings -> Environments with:
#   secrets:   RENDER_API_KEY  (Render -> Account Settings -> API Keys)
#              REDIS_URL       (Upstash Redis TLS URL, rediss://...)
#   variables: RENDER_API_SERVICE_ID  (srv-... from the API service URL)
#
# The admin web deploy is still a placeholder: add RENDER_ADMIN_WEB_DEPLOY_HOOK
# as an environment secret and uncomment its step when that service exists.

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
    steps:
      # Fail here rather than deploy an API that silently falls back to localhost Redis
      - name: Check deploy config
        run: |
          missing=0
          for name in RENDER_API_KEY RENDER_API_SERVICE_ID REDIS_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the dev environment"
              missing=1
            fi
          done
          exit "$missing"

      # Render is what the API reads its env from, so copy the values over before deploying
      - name: Sync API env vars to Render
        run: |
          set_var() {
            curl -fsS -o /dev/null -X PUT \
              "https://api.render.com/v1/services/$RENDER_API_SERVICE_ID/env-vars/$1" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg value "$2" '{value: $value}')"
          }
          set_var ENVIRONMENT dev
          set_var REDIS_URL "$REDIS_URL"

      - name: Deploy API
        run: |
          curl -fsS -o /dev/null -X POST \
            "https://api.render.com/v1/services/$RENDER_API_SERVICE_ID/deploys" \
            -H "Authorization: Bearer $RENDER_API_KEY"

      # - name: Deploy admin web
      #   run: curl -fsS -X POST "${{ secrets.RENDER_ADMIN_WEB_DEPLOY_HOOK }}"
