name: API CI

on:
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
      - ".github/actions/setup-api/**"

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Same Redis as the root docker-compose.yml, for tests that need it
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    env:
      ENVIRONMENT: dev
      REDIS_URL: redis://localhost:6379/0
      # Throwaway values so settings load like a real deploy. Real secrets stay on the
      # `dev` environment and are never exposed to pull request runs.
      JWT_SECRET_KEY: ci-only-not-a-real-secret
      JWT_ALGORITHM: HS256
      FIREBASE_PROJECT_ID: ci-project

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-api

      - name: Check app imports
        working-directory: api
        run: uv run python -c "import main"

      # Boots the real server and waits for /health to answer.
      # Runs the venv's Python directly and stops it afterwards: a server left running
      # under `uv run` holds the uv cache lock and makes the post-job cache prune time out.
      - name: Smoke test
        working-directory: api
        run: |
          .venv/bin/python -m uvicorn main:app --port 8000 &
          trap 'kill $!' EXIT
          curl --fail --silent --show-error --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:8000/health

      # pytest exits 5 when it collects no tests - allowed until the first test_*.py lands under api/tests
      - name: Run tests
        working-directory: api
        run: |
          status=0
          uv run --with pytest pytest tests || status=$?
          if [ "$status" -eq 5 ]; then
            echo "No tests yet - skipping pytest."
          else
            exit "$status"
          fi